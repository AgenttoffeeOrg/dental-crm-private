# CodeRabbit Configuration for Dental CRM
# https://docs.coderabbit.ai/configuration

# Language and framework settings
language:
  - name: javascript
    version: ">=20.0.0"
  - name: typescript
    version: "^5"
  - name: react
    version: "19.1.0"
  - name: nextjs
    version: "14.2.18"

# Analyzers configuration
analyzers:
  - name: javascript
    enabled: true
    frameworks:
      - react
    environments:
      - nodejs
      - browser
      - jest
    transformers:
      - prettier
  - name: secrets
    enabled: true
  - name: shell
    enabled: true
  - name: sql
    enabled: true
  - name: test_coverage
    enabled: true

# Paths to include/exclude
paths:
  include:
    - "src/**/*.{ts,tsx,js,jsx}"
    - "supabase/migrations/**/*.sql"
    - "scripts/**/*.{ts,js,sh}"
  exclude:
    - "node_modules/**"
    - ".next/**"
    - "dist/**"
    - "build/**"
    - "**/*.test.{ts,tsx,js,jsx}"
    - "**/*.spec.{ts,tsx,js,jsx}"
    - "tests/**"
    - "__tests__/**"
    - "public/**"

# Review settings
reviews:
  # Review all pull requests
  always_review: true
  
  # Review threshold - minimum number of reviewers
  reviewers:
    min: 1
  
  # Comment on pull requests
  comment:
    enabled: true
    
  # Request changes on critical issues
  request_changes:
    enabled: true
    on:
      - security
      - performance
      - breaking_changes

# Rules and guidelines
rules:
  # Security rules
  security:
    - check_for_secrets: true
    - check_for_sql_injection: true
    - check_for_xss: true
    - check_for_csrf: true
    - check_dependencies: true
  
  # Code quality rules
  quality:
    - check_complexity: true
    - check_duplication: true
    - check_maintainability: true
    - check_test_coverage: true
  
  # Performance rules
  performance:
    - check_bundle_size: true
    - check_database_queries: true
    - check_api_response_times: true
  
  # Best practices
  best_practices:
    - enforce_typescript: true
    - enforce_error_handling: true
    - enforce_logging: true
    - check_accessibility: true

# Ignore patterns for specific checks
ignore:
  # Ignore certain file patterns
  files:
    - "**/*.d.ts"
    - "**/generated/**"
    - "**/migrations/**"
  
  # Ignore certain rules for specific paths
  rules:
    - path: "**/migrations/**"
      rules:
        - check_test_coverage
        - check_complexity

# Custom prompts for AI review
prompts:
  - name: "Next.js Best Practices"
    prompt: |
      Review this code for Next.js 14 best practices:
      - Proper use of Server Components vs Client Components
      - Correct API route patterns
      - Proper error handling and error boundaries
      - TypeScript type safety
      - Performance optimizations
      - Security considerations
  
  - name: "React 19 Patterns"
    prompt: |
      Review this React code for React 19 patterns:
      - Proper use of hooks
      - Component composition
      - State management patterns
      - Performance optimizations (useMemo, useCallback)
      - Accessibility (ARIA labels, keyboard navigation)
  
  - name: "Database & Supabase"
    prompt: |
      Review this database code for:
      - Proper use of Row Level Security (RLS)
      - Efficient queries and indexes
      - Proper error handling
      - SQL injection prevention
      - Migration best practices

# Notification settings
notifications:
  # Comment on PRs
  comment: true
  
  # Request changes on critical issues
  request_changes: true
  
  # Approve if no issues found
  auto_approve: false



