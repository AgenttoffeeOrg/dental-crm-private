# SonarCloud Configuration for Dental CRM

sonar.projectKey=AgenttoffeeOrg_dental-crm-private
sonar.organization=agenttoffeeorg

# Source directories
sonar.sources=src
sonar.tests=tests,__tests__

# Exclusions
sonar.exclusions=**/node_modules/**,**/*.test.ts,**/*.spec.ts,**/dist/**,**/.next/**

# Test file patterns
sonar.test.inclusions=**/*test*.ts,**/*test*.tsx,**/*spec*.ts,**/*spec*.tsx,**/tests/**/*.sql

# Coverage exclusions
sonar.coverage.exclusions=**/*test*/**,**/*spec*/**,**/tests/**

# Duplication exclusions (test files should be explicit and readable)
sonar.cpd.exclusions=**/tests/**/*.sql,**/*test*.sql,**/verification/**/*.sql

# SQL-specific settings
sonar.plsql.file.suffixes=.sql
sonar.lang.patterns.sql=**/*.sql

# Disable string duplication rule for test files
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=**/tests/**/*.sql
sonar.issue.ignore.multicriteria.e2.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.e2.resourceKey=**/verification/**/*.sql

# Increase Node.js heap size for large codebase analysis
# Default is 2096 MB, increasing to 4096 MB to handle 1089+ files
sonar.javascript.node.maxspace=4096

