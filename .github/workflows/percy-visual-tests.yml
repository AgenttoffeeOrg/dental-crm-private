name: Percy Visual Tests

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  visual-tests:
    name: Percy Visual Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Percy visual tests
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          BASE_URL: ${{ vars.BASE_URL || 'http://localhost:3000' }}
        run: |
          if [ -z "$PERCY_TOKEN" ]; then
            echo "⚠️ PERCY_TOKEN not set, skipping Percy tests"
            npm run test:visual || echo "Visual tests completed without Percy"
          else
            npx percy exec -- npm run test:visual
          fi

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const message = [
              '## 🎨 Percy Visual Test Results',
              '',
              '**Status:** Visual regression tests completed',
              '',
              '**What was tested:**',
              '- Component visual consistency',
              '- Layout regressions',
              '- Responsive design',
              '- Cross-browser compatibility',
              '',
              '📸 View visual diffs in Percy dashboard'
            ].join('\n');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

