name: Checkly Deploy - Synthetic Monitors

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  checkly-deploy:
    name: Deploy Checkly Monitors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Checkly CLI
        run: npm install -g checkly@latest
      
      - name: Install check dependencies
        working-directory: ./checkly
        run: npm install
      
      - name: Deploy checks to Checkly
        working-directory: ./checkly
        env:
          CHECKLY_API_KEY: ${{ secrets.CHECKLY_API_KEY }}
          CHECKLY_ACCOUNT_ID: ${{ vars.CHECKLY_ACCOUNT_ID }}
          BASE_URL: ${{ vars.BASE_URL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          CHECKLY_REGION_LIST: ${{ vars.CHECKLY_REGION_LIST }}
        run: |
          echo "🚀 Deploying Checkly monitors for $BASE_URL"
          npx checkly deploy --force
      
      - name: Summary
        run: |
          echo "✅ Checkly monitors deployed successfully"
          echo "📊 View dashboard: https://app.checklyhq.com/"

