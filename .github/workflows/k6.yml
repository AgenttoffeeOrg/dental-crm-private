name: k6 Load Tests

on:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 1 * * *"  # Daily at 1 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  k6-load-testing:
    name: k6 Load Testing
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg software-properties-common
          curl -s https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
          k6 version

      - name: Run k6 Smoke Test
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: k6 run k6/smoke.js

      - name: Run k6 Load Test
        if: github.event_name != 'pull_request'
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: k6 run --summary-export k6-summary.json k6/load.js

      - name: Upload k6 Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: k6-summary.json
          if-no-files-found: ignore

      - name: Comment PR with k6 Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const message = [
              '## 📊 k6 Load Test Results',
              '',
              '**Smoke Test:** Passed ✅',
              '**Target:** `' + (process.env.BASE_URL || 'https://dental-crm-private-production.up.railway.app') + '`',
              '',
              '**Tests Run:**',
              '- Smoke test (1 VU, 1 minute)',
              '- Endpoints: /api/health, /, /login, /marketing-audit',
              '',
              '**Thresholds:**',
              '- Failed requests: <1%',
              '- Response time p95: <500ms',
              '',
              '📈 Full load test runs on merge to main (scheduled daily)'
            ].join('\\n');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

