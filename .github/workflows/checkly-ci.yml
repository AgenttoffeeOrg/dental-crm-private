name: Checkly CI - Synthetic Monitoring Tests

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  checkly-test:
    name: Run Checkly Synthetic Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Checkly CLI
        run: npm install -g checkly@latest
      
      - name: Install check dependencies
        working-directory: ./checkly
        run: npm install
      
      - name: Run Checkly tests
        working-directory: ./checkly
        env:
          CHECKLY_API_KEY: ${{ secrets.CHECKLY_API_KEY }}
          CHECKLY_ACCOUNT_ID: ${{ vars.CHECKLY_ACCOUNT_ID }}
          BASE_URL: ${{ vars.BASE_URL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          CHECKLY_REGION_LIST: ${{ vars.CHECKLY_REGION_LIST }}
        run: |
          echo "🧪 Running Checkly synthetic checks against $BASE_URL"
          
          # Check if required variables are set
          if [ -z "$CHECKLY_API_KEY" ] || [ -z "$CHECKLY_ACCOUNT_ID" ]; then
            echo "⚠️  CHECKLY_ACCOUNT_ID not set. Skipping Checkly checks."
            echo "To enable Checkly monitoring:"
            echo "1. Set CHECKLY_ACCOUNT_ID repo variable"
            echo "2. Ensure CHECKLY_API_KEY secret is set"
            echo ""
            echo "✓ Skipping Checkly checks (not required for deployment)"
            exit 0
          fi
          
          npx checkly test --reporter=junit --reporter=list || {
            echo "⚠️  Checkly tests failed"
            echo "This is advisory only and won't block deployment"
            exit 0
          }
        continue-on-error: true
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkly-test-results
          path: checkly/checkly-junit.xml
          retention-days: 7

