name: Percy Visual Tests

on:
  pull_request:
    branches: ["main"]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'percy.config.js'
      - '.github/workflows/percy.yml'
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  percy-tests:
    name: Percy Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      
      - name: Run Percy visual tests
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          BASE_URL: ${{ vars.BASE_URL || 'http://localhost:3000' }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npm run test:visual
      
      - name: Upload Percy logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: percy-logs
          path: |
            percy-*.log
            .percy/
          retention-days: 7
          if-no-files-found: ignore
      
      - name: Comment PR with Percy results
        if: github.event_name == 'pull_request' && env.PERCY_TOKEN != ''
        uses: actions/github-script@v7
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
        with:
          script: |
            const body = `📸 Percy visual regression tests are running. View results at [Percy Dashboard](https://percy.io/)`
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })

