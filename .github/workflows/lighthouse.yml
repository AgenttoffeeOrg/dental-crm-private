name: Lighthouse CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse-ci:
    name: Lighthouse Performance & Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: Configure URLs from BASE_URL
        env:
          BASE_URL: ${{ vars.BASE_URL }}
        run: |
          echo "Using BASE_URL=$BASE_URL"
          if [ -z "$BASE_URL" ]; then
            export BASE_URL="https://dental-crm-private-production.up.railway.app"
            echo "BASE_URL not set, using default: $BASE_URL"
          fi
          
          # Update lighthouserc.json with actual BASE_URL
          sed -i.bak "s|\${BASE_URL}|$BASE_URL|g" lighthouserc.json
          cat lighthouserc.json | grep -A 5 '"url"'

      - name: Run Lighthouse CI
        env:
          BASE_URL: ${{ vars.BASE_URL }}
        run: |
          export BASE_URL="${BASE_URL:-https://dental-crm-private-production.up.railway.app}"
          npx lhci autorun --upload.target=filesystem --upload.outputDir=./lhci-reports

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: ./lhci-reports/
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const baseUrl = process.env.BASE_URL || 'https://dental-crm-private-production.up.railway.app';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔦 Lighthouse CI Results

**Tested against:** \`${baseUrl}\`

**Routes tested:**
- Homepage (\`/\`)
- Login (\`/login\`)
- Dashboard (\`/dashboard\`)
- Marketing Audit (\`/marketing-audit\`)
- Offline (\`/offline\`)

**Quality Budgets:**
- ✅ Performance: ≥90
- ✅ Accessibility: ≥90
- ✅ Best Practices: ≥95
- ✅ SEO: ≥90

**Core Web Vitals:**
- LCP (Largest Contentful Paint): ≤2.5s
- TBT (Total Blocking Time): ≤200ms
- CLS (Cumulative Layout Shift): ≤0.1

📊 View detailed reports in workflow artifacts: **lighthouse-reports**`
            });
        env:
          BASE_URL: ${{ vars.BASE_URL }}

